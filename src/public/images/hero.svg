<svg viewBox="0 0 640 540" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#837dff"/>
      <stop offset="1" stop-color="#6d67f6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d222c"/>
      <stop offset="1" stop-color="#14171e"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222736"/>
      <stop offset="1" stop-color="#181c25"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d67f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d67f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b8bff"/>
      <stop offset="0.6" stop-color="#6d67f6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- ambient glows -->
  <circle cx="150" cy="150" r="120" fill="#6d67f6" opacity="0.30" filter="url(#glow)"/>
  <circle cx="500" cy="420" r="120" fill="#34d399" opacity="0.20" filter="url(#glow)"/>

  <!-- ===== Main dashboard card ===== -->
  <g filter="url(#softShadow)">
    <rect x="70" y="96" width="420" height="320" rx="26" fill="url(#cardBg)" stroke="#2b3140" stroke-width="1.5"/>
  </g>

  <!-- header row -->
  <text x="100" y="142" fill="#9aa1ad" font-size="15" font-weight="600">Total balance</text>
  <text x="100" y="180" fill="#f3f4f7" font-size="34" font-weight="800">$12,480.50</text>
  <g transform="translate(312,158)">
    <rect x="0" y="0" width="70" height="26" rx="13" fill="#34d399" opacity="0.16"/>
    <path d="M13 17 L19 10 L24 14 L31 7" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="18" fill="#34d399" font-size="13" font-weight="700">8.2%</text>
  </g>

  <!-- period pills -->
  <g transform="translate(360,132)">
    <rect x="0" y="0" width="40" height="24" rx="12" fill="#6d67f6"/>
    <text x="20" y="16" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1M</text>
    <rect x="46" y="0" width="40" height="24" rx="12" fill="#232833"/>
    <text x="66" y="16" fill="#9aa1ad" font-size="11" font-weight="700" text-anchor="middle">1Y</text>
  </g>

  <!-- grid lines -->
  <g stroke="#262b36" stroke-width="1">
    <line x1="100" y1="250" x2="460" y2="250"/>
    <line x1="100" y1="300" x2="460" y2="300"/>
    <line x1="100" y1="350" x2="460" y2="350"/>
  </g>

  <!-- area + line chart -->
  <path d="M100 300 C132 300 140 264 176 266 C212 268 224 236 262 244 C300 252 314 214 348 214 C384 214 396 240 420 232 C440 226 452 200 460 196 L460 380 L100 380 Z" fill="url(#areaFill)"/>
  <path d="M100 300 C132 300 140 264 176 266 C212 268 224 236 262 244 C300 252 314 214 348 214 C384 214 396 240 420 232 C440 226 452 200 460 196" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- data points -->
  <circle cx="262" cy="244" r="4.5" fill="#14171e" stroke="#6d67f6" stroke-width="3"/>
  <circle cx="348" cy="214" r="4.5" fill="#14171e" stroke="#6d67f6" stroke-width="3"/>
  <circle cx="460" cy="196" r="6" fill="#34d399" stroke="#14171e" stroke-width="3"/>

  <!-- ===== Floating donut card (top-right) ===== -->
  <g filter="url(#softShadow)">
    <rect x="404" y="60" width="196" height="150" rx="22" fill="url(#cardBg2)" stroke="#2f3546" stroke-width="1.5"/>
  </g>
  <text x="428" y="92" fill="#c7ccd6" font-size="13" font-weight="700">Spending</text>
  <g transform="translate(470,150)">
    <circle r="34" fill="none" stroke="#232a37" stroke-width="14"/>
    <!-- circumference ~ 213.6 -->
    <circle r="34" fill="none" stroke="#6d67f6" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="96 118" transform="rotate(-90)"/>
    <circle r="34" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="60 154" stroke-dashoffset="-100" transform="rotate(-90)"/>
    <circle r="34" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="36 178" stroke-dashoffset="-164" transform="rotate(-90)"/>
  </g>
  <g transform="translate(516,120)" font-size="11" font-weight="600">
    <circle cx="4" cy="4" r="4" fill="#6d67f6"/><text x="16" y="8" fill="#9aa1ad">Home</text>
    <circle cx="4" cy="26" r="4" fill="#34d399"/><text x="16" y="30" fill="#9aa1ad">Food</text>
    <circle cx="4" cy="48" r="4" fill="#fbbf24"/><text x="16" y="52" fill="#9aa1ad">Other</text>
  </g>

  <!-- ===== Floating transactions card (bottom-left) ===== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="356" width="250" height="150" rx="22" fill="url(#cardBg2)" stroke="#2f3546" stroke-width="1.5"/>
  </g>
  <text x="64" y="388" fill="#c7ccd6" font-size="13" font-weight="700">Recent activity</text>

  <!-- row 1 (income) -->
  <g transform="translate(64,402)">
    <rect x="0" y="0" width="34" height="34" rx="10" fill="#34d399" opacity="0.16"/>
    <path d="M17 25 L17 9 M11 15 L17 9 L23 15" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="6" width="90" height="8" rx="4" fill="#39404e"/>
    <rect x="46" y="20" width="58" height="6" rx="3" fill="#2a3040"/>
    <text x="202" y="22" fill="#34d399" font-size="14" font-weight="700" text-anchor="end">+$540</text>
  </g>
  <!-- row 2 (expense) -->
  <g transform="translate(64,452)">
    <rect x="0" y="0" width="34" height="34" rx="10" fill="#f87171" opacity="0.16"/>
    <path d="M17 9 L17 25 M11 19 L17 25 L23 19" stroke="#f87171" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="6" width="76" height="8" rx="4" fill="#39404e"/>
    <rect x="46" y="20" width="48" height="6" rx="3" fill="#2a3040"/>
    <text x="202" y="22" fill="#f87171" font-size="14" font-weight="700" text-anchor="end">-$86</text>
  </g>

  <!-- floating coin -->
  <g filter="url(#softShadow)" transform="translate(560,300)">
    <circle r="30" fill="url(#accent)"/>
    <circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="0" y="10" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">$</text>
  </g>
</svg>
